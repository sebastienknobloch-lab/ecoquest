<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>EcoQuest</title>
  <meta name="description" content="Chaque geste compte, et en famille ça se voit." />
  <meta name="theme-color" content="#2e7d32" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="EcoQuest" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="app-header">
    <h1>🌱 EcoQuest</h1>
    <p class="app-status" data-app-status>Chargement…</p>
  </header>

  <main class="view-root" data-view-root></main>

  <nav class="tab-bar" data-tab-bar aria-label="Navigation principale">
    <button class="tab-btn" type="button" data-tab="aujourdhui">
      <span class="tab-icon" aria-hidden="true">📋</span>
      <span class="tab-label">Aujourd'hui</span>
    </button>
    <button class="tab-btn" type="button" data-tab="defis">
      <span class="tab-icon" aria-hidden="true">🏆</span>
      <span class="tab-label">Défis</span>
    </button>
    <button class="tab-btn" type="button" data-tab="foyer">
      <span class="tab-icon" aria-hidden="true">🏠</span>
      <span class="tab-label">Foyer</span>
    </button>
    <button class="tab-btn" type="button" data-tab="profil">
      <span class="tab-icon" aria-hidden="true">🙂</span>
      <span class="tab-label">Profil</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
