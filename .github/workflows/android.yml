name: Android AAB (release, signé)

# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_BASE64   → keystore .jks/.keystore encodé en base64 (base64 -w0 keystore.jks)
#   ANDROID_KEYSTORE_PASSWORD → mot de passe du keystore
#   ANDROID_KEY_ALIAS         → alias de la clé de signature
#   ANDROID_KEY_PASSWORD      → mot de passe de la clé
# Ces valeurs ne sont jamais affichées : elles ne transitent que par des
# variables d'environnement lues par Gradle (voir .github/gradle/signing-init.gradle).

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Installer les dépendances
        run: npm install

      - name: Préparer webDir (www/)
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r css icons js data www/

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser le web dir avec Android
        run: npx cap sync android

      - name: Décoder le keystore de signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set +x
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 manquant : impossible de signer l'AAB." >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/ecoquest-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          chmod 600 "$keystore_path"
          if [ ! -s "$keystore_path" ]; then
            echo "Le keystore décodé est vide : vérifier le contenu du secret ANDROID_KEYSTORE_BASE64." >&2
            exit 1
          fi
          echo "keystore_path=$keystore_path" >> "$GITHUB_ENV"

      - name: Builder l'AAB de release signé
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # run_number n'augmente jamais deux fois de la même valeur pour ce
          # workflow : garantit un versionCode Play Store unique et croissant
          # sans état à maintenir à la main (voir version-init.gradle).
          ECOQUEST_VERSION_CODE: ${{ github.run_number }}
          ECOQUEST_VERSION_NAME: ${{ github.ref_name }}
        run: |
          set +x
          ./gradlew bundleRelease \
            --init-script ../.github/gradle/signing-init.gradle \
            --init-script ../.github/gradle/version-init.gradle

      - name: Supprimer le keystore déchiffré
        if: always()
        run: rm -f "${{ env.keystore_path }}"

      - name: Publier l'AAB en artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoquest-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
