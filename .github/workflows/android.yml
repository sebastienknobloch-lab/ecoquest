name: Android APK (debug)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Installer les dépendances
        run: npm install

      - name: Préparer webDir (www/)
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r css icons js data www/

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser le web dir avec Android
        run: npx cap sync android

      - name: Builder l'APK de debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoquest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
